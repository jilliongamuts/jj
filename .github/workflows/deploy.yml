name: Deploy to VPS

on:
  workflow_dispatch:  # manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: SSH Deploy
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: hr.jg-suite.cloud
          username: deployer
          key: ssh-rsa  deploy@jg-suite
          port: 22
          script: |
            cd /home/jgsuite/public_html
            git pull origin main
